buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url "https://chaquo.com/maven" }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.4'
        classpath "com.chaquo.python:gradle:15.0.1"
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
